# Dependency update PRs (free on GitHub). Weekly, grouped, so review stays manageable.
# Security updates are opened as soon as an advisory is published, independent of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker
    directories: [/engines/api]
    schedule: { interval: weekly, day: monday }
