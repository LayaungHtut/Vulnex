[project]
name = "vulnex-scanner"
version = "0.1.0"
description = "VULNEX scanner worker: outbound-only, enforces its signed scope locally"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28", "vulnex-worker-protocol"]

[project.scripts]
vulnex-scanner = "vulnex_scanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnex_scanner"]

[tool.uv.sources]
vulnex-worker-protocol = { workspace = true }
