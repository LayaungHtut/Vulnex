[project]
name = "vulnex"
version = "0.1.0"
description = "VULNEX control plane API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
    "vulnex-worker-protocol",
]

[dependency-groups]
dev = ["httpx>=0.28", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "vulnex-scanner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnex"]

[tool.uv.sources]
vulnex-worker-protocol = { workspace = true }
vulnex-scanner = { workspace = true }
