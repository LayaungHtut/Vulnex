# Lab target only: HTTPS with a self-signed certificate that expired (created by lab-certs).
server {
    listen 443 ssl;
    ssl_certificate     /certs/expired.crt;
    ssl_certificate_key /certs/expired.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { return 200 '<html><title>Lab admin console</title></html>'; add_header Content-Type text/html; }
}
