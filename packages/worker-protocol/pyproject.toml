[project]
name = "vulnex-worker-protocol"
version = "0.1.0"
description = "Shared VULNEX worker protocol: target parsing, scope leases, wire models"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = ["cryptography>=44", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnex_worker_protocol"]
